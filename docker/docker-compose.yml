services:
  postgres:
    image: postgres:16
    container_name: medallion-airflow-postgres
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow -d airflow"]
      interval: 10s
      timeout: 5s
      retries: 5

  airflow-init:
    build:
      context: .
      dockerfile: airflow/Dockerfile
    container_name: medallion-airflow-init
    environment: &airflow-env
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
      AIRFLOW__WEBSERVER__SECRET_KEY: temporary-secret-key
      AIRFLOW_PROJECT_ROOT: /opt/airflow
      PYTHONPATH: /opt/airflow
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-ap-southeast-1}
      S3_BUCKET: ${S3_BUCKET:-olist-lakehouse-data}
      BRONZE_PREFIX: ${BRONZE_PREFIX:-bronze}
      SILVER_PREFIX: ${SILVER_PREFIX:-silver}
      GOLD_PREFIX: ${GOLD_PREFIX:-gold}
      BRONZE_PATH: ${BRONZE_PATH:-/opt/airflow/data/bronze}
      SILVER_PATH: ${SILVER_PATH:-/opt/airflow/data/silver}
      GOLD_PATH: ${GOLD_PATH:-/opt/airflow/data/gold}
      ATHENA_DATABASE: ${ATHENA_DATABASE:-olist_lakehouse}
      ATHENA_WORKGROUP: ${ATHENA_WORKGROUP:-primary}
      ATHENA_OUTPUT_LOCATION: ${ATHENA_OUTPUT_LOCATION:-s3://olist-lakehouse-data/athena-results/}
      ATHENA_SKIP_EXECUTION: ${ATHENA_SKIP_EXECUTION:-true}
    volumes: &airflow-volumes
      - ../dags:/opt/airflow/dags
      - ../scripts:/opt/airflow/scripts
      - ../configs:/opt/airflow/configs
      - ../db:/opt/airflow/db
      - ../data:/opt/airflow/data
      - ./airflow/logs:/opt/airflow/logs
      - ./airflow/plugins:/opt/airflow/plugins
      - ~/.aws:/home/airflow/.aws:ro
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      bash -c "airflow db migrate &&
      airflow users create
      --username admin
      --password admin
      --firstname Admin
      --lastname User
      --role Admin
      --email admin@example.com || true"

  airflow-webserver:
    build:
      context: .
      dockerfile: airflow/Dockerfile
    container_name: medallion-airflow-webserver
    environment: *airflow-env
    ports:
      - "8080:8080"
    volumes: *airflow-volumes
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    command: ["airflow", "webserver"]

  airflow-scheduler:
    build:
      context: .
      dockerfile: airflow/Dockerfile
    container_name: medallion-airflow-scheduler
    environment: *airflow-env
    volumes: *airflow-volumes
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    command: ["airflow", "scheduler"]

volumes:
  postgres_data:
